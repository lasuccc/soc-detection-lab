<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="860" height="520" fill="#0f172a"/>

  <text x="430" y="42" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">Home SOC Lab — AWS Architecture</text>
  <text x="430" y="66" fill="#94a3b8" font-size="13" text-anchor="middle">Isolated VPC 10.0.0.0/16 · security groups enforce least-privilege access</text>

  <!-- VPC boundary -->
  <rect x="40" y="90" width="780" height="330" rx="12" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="58" y="114" fill="#64748b" font-size="13" font-weight="600">AWS VPC · soc-lab</text>

  <!-- Wazuh box -->
  <rect x="80" y="150" width="230" height="230" rx="10" fill="#132a3f" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="180" fill="#60a5fa" font-size="15" font-weight="700" text-anchor="middle">Wazuh SIEM</text>
  <text x="195" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">Ubuntu 22.04 · t3.medium</text>
  <line x1="100" y1="212" x2="290" y2="212" stroke="#1e3a5f" stroke-width="1"/>
  <text x="195" y="234" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Manager · rules engine</text>
  <text x="195" y="254" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Indexer · log storage</text>
  <text x="195" y="274" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Dashboard · web UI</text>
  <text x="195" y="308" fill="#64748b" font-size="10.5" text-anchor="middle">10.0.1.245</text>
  <text x="195" y="352" fill="#f59e0b" font-size="10.5" text-anchor="middle">custom detection rules</text>
  <text x="195" y="368" fill="#f59e0b" font-size="10.5" text-anchor="middle">100100 · 100200 · 100201</text>

  <!-- Windows box -->
  <rect x="500" y="150" width="230" height="120" rx="10" fill="#132a3f" stroke="#22c55e" stroke-width="2"/>
  <text x="615" y="180" fill="#4ade80" font-size="15" font-weight="700" text-anchor="middle">Windows Server 2022</text>
  <text x="615" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">Domain Controller · lab.local</text>
  <line x1="520" y1="212" x2="710" y2="212" stroke="#14532d" stroke-width="1"/>
  <text x="615" y="234" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Active Directory · Wazuh agent</text>
  <text x="615" y="254" fill="#64748b" font-size="10.5" text-anchor="middle">monitored endpoint</text>

  <!-- Kali box -->
  <rect x="500" y="300" width="230" height="80" rx="10" fill="#132a3f" stroke="#ef4444" stroke-width="2"/>
  <text x="615" y="330" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle">Kali Linux</text>
  <text x="615" y="352" fill="#cbd5e1" font-size="11.5" text-anchor="middle">attacker · simulated TTPs</text>

  <!-- Arrows -->
  <!-- Kali attacks Windows -->
  <line x1="615" y1="300" x2="615" y2="272" stroke="#ef4444" stroke-width="2" marker-end="url(#red)"/>
  <text x="700" y="290" fill="#f87171" font-size="10.5" text-anchor="middle">attack</text>

  <!-- Windows ships logs to Wazuh -->
  <line x1="500" y1="210" x2="312" y2="230" stroke="#22c55e" stroke-width="2" marker-end="url(#green)"/>
  <text x="405" y="205" fill="#4ade80" font-size="10.5" text-anchor="middle">agent logs · 1514/1515</text>

  <!-- Analyst views dashboard -->
  <line x1="195" y1="150" x2="195" y2="470" stroke="#3b82f6" stroke-width="0"/>

  <!-- Analyst -->
  <circle cx="195" cy="470" r="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="195" cy="465" r="5" fill="#60a5fa"/>
  <path d="M185 478 q10 -10 20 0" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <text x="240" y="474" fill="#94a3b8" font-size="12" text-anchor="start">Analyst · HTTPS 443</text>
  <line x1="195" y1="454" x2="195" y2="382" stroke="#3b82f6" stroke-width="2" marker-end="url(#blue)"/>

  <defs>
    <marker id="red" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#ef4444"/></marker>
    <marker id="green" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#22c55e"/></marker>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
